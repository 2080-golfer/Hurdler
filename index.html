<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hurdler - 허들 달리기 게임</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="score-board">
            <span id="score">0</span>
            <span id="high-score">HI 0</span>
        </div>
        <canvas id="game-canvas"></canvas>
        <div id="start-screen">
            <h1>🏃 HURDLER 🏃</h1>
            <p>스페이스바 또는 화면을 터치하여 점프!</p>
            <p class="start-hint">게임 시작: 스페이스바 / 터치</p>
        </div>
        <div id="game-over" class="hidden">
            <h2>GAME OVER</h2>
            <p>점수: <span id="final-score">0</span></p>
            <p class="restart-hint">재시작: 스페이스바 / 터치</p>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
